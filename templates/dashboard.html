<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Productivity Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #e0f7fa, #e1bee7);
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            font-size: 28px;
            color: #6a1b9a;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .card {
            background: #f3e5f5;
            border-left: 6px solid #8e24aa;
            padding: 20px;
            border-radius: 8px;
            width: 230px;
            margin: 10px;
        }
        .card h3 {
            margin: 0 0 10px 0;
            color: #4a148c;
        }
        .site-list {
            margin-top: 30px;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
        }
        .site-list-header {
            background: #ce93d8;
            color: #fff;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
        }
        .site-entries {
            background: #fafafa;
        }
        .site-entry {
            display: flex;
            justify-content: space-between;
            padding: 10px 15px;
            border-bottom: 1px solid #e0e0e0;
        }
        .site-entry:last-child {
            border-bottom: none;
        }
        .site-entry span {
            font-size: 14px;
            color: #333;
        }
        .footer {
            text-align: center;
            margin-top: 30px;
            color: #888;
        }
        .image-container {
            text-align: center;
            margin-top: 30px;
        }
        .image-container img {
            max-width: 100%;
            height: auto;
            border-radius: 12px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⏱️ Weekly Productivity Report</h1>

        <div class="stats">
            <div class="card">
                <h3>Date</h3>
                <p id="date">Loading...</p>
            </div>
            <div class="card">
                <h3>Total Time</h3>
                <p id="total">Loading...</p>
            </div>
            <div class="card">
                <h3>Productive Time</h3>
                <p id="productive">Loading...</p>
            </div>
            <div class="card">
                <h3>Productivity %</h3>
                <p id="productivity">Loading...</p>
            </div>
        </div>

        <h2 style="margin-top: 30px; color: #6a1b9a;">🧠 Websites Visited</h2>

        <div class="site-list">
            <div class="site-list-header">
                <span>Website</span>
                <span>Time Spent</span>
            </div>
            <div id="websites" class="site-entries"></div>
        </div>

        <div class="image-container">
            <img src="https://cdn-icons-png.flaticon.com/512/1086/1086933.png" alt="Productivity Illustration" />
        </div>

        <div class="footer">
            <p>Built with 💻 and ☕ by CodTech Intern</p>
        </div>
    </div>

    <script>
        async function loadReport() {
            const res = await fetch('/api/report/default?ts=' + Date.now());
            const data = await res.json();

            document.getElementById("date").textContent = data.date;
            document.getElementById("total").textContent = `${data.total_time}s`;
            document.getElementById("productive").textContent = `${data.productive_time}s`;
            document.getElementById("productivity").textContent = `${data.productivity}%`;

            const siteList = document.getElementById("websites");
            siteList.innerHTML = '';
            Object.entries(data.sites).forEach(([site, time]) => {
                const div = document.createElement('div');
                div.className = 'site-entry';
                div.innerHTML = `
                    <span>${site}</span>
                    <span>${time}s</span>
                `;
                siteList.appendChild(div);
            });
        }

        loadReport();
    </script>
</body>
</html>
